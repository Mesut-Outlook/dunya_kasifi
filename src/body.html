<div class="app" id="app">
  <header class="bar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#A8DCF0" stroke="#1B2A41" stroke-width="2.5"/><path d="M9 14c4-1 6 2 9 1s3-5 7-4 4 5 2 7-6 1-7 4 2 6-1 8-6-1-7-4-5-2-4-6z" fill="#9ED39A" stroke="#1B2A41" stroke-width="2"/><path d="M3 20h34" stroke="#1B2A41" stroke-width="1.5" stroke-dasharray="3 3"/></svg>
      <div><h1 id="appTitle">Dünya Kaşifi</h1><small id="appSub">Atlas · Küre · Oyunlar</small></div>
    </div>
    <div class="seg" role="group" aria-label="mode">
      <button id="mExplore" aria-pressed="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span class="lbl" data-i="explore">Keşfet</span></button>
      <button id="mTests" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="m9 12 2 2 4-4"/></svg><span class="lbl" data-i="tests">Testler</span></button>
      <button id="mPlay" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"><path d="M6 4l14 8-14 8z"/></svg><span class="lbl" data-i="play">Oyna</span></button>
    </div>
    <div class="seg" role="group" aria-label="view">
      <button id="vAtlas" aria-pressed="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span class="lbl" data-i="atlas">Atlas</span></button>
      <button id="vGlobe" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg><span class="lbl" data-i="globe">Küre</span></button>
    </div>
    <div class="seg" role="group" aria-label="language">
      <button id="lTR" aria-pressed="true">TR</button>
      <button id="lNL" aria-pressed="false">NL</button>
    </div>
    <button class="chip-btn" id="dualBtn" title=""><span id="dualLbl">TR+NL</span></button>
    <button class="chip-btn" id="soundBtn" aria-pressed="true" title=""><svg id="soundIco" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg></button>
    <button class="chip-btn passport" id="passBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="11" r="3.5"/></svg><span><b id="passN">0</b>/<span id="passT">0</span></span></button>
  </header>
  <main class="stage atlas" id="stage">
    <svg id="map" role="img" aria-label="map"></svg>
    <div class="float search" id="searchBox">
      <input id="search" type="search" autocomplete="off" placeholder="">
      <div class="results" id="results" hidden></div>
    </div>
    <div class="float layers" id="layers"></div>
    <div class="float zoombox">
      <button class="chip-btn" id="zIn" aria-label="+">+</button>
      <button class="chip-btn" id="zOut" aria-label="−">−</button>
      <button class="chip-btn" id="zHome" title=""><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></button>
      <button class="chip-btn" id="zTR" title="Türkiye" style="font-size:12px">TR</button>
      <button class="chip-btn" id="zNL" title="Nederland" style="font-size:12px">NL</button>
    </div>
    <aside class="panel" id="panel" hidden></aside>
    <div class="hud" id="hud" hidden></div>
    <div class="score-strip" id="scores" hidden></div>
    <div class="float hint" id="hint" hidden></div>
    <div class="modal" id="modal" hidden></div>
    <canvas id="confetti"></canvas>
  </main>
</div>
